name: NPM Release

on:
  workflow_dispatch:
    inputs:
      skip_package_age:
        description: "Bypass Aikido safe-chain minimum package age check"
        type: boolean
        default: false
      skip_safe_chain:
        description: "Install without Aikido safe-chain (only when its service is down)"
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
      # Every install goes through safe-chain's policy check and proxy. When
      # its service is down ("Safe-chain: Uncaught exception: unexpected end
      # of file" while verifying the lockfile, then every fetch fails), run
      # the workflow by hand with skip_safe_chain to release without it.
      - name: Install safe-chain
        if: ${{ !inputs.skip_safe_chain }}
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci
      - name: Install dependencies
        run: pnpm install --frozen-lockfile ${{ inputs.skip_package_age && !inputs.skip_safe_chain && '--safe-chain-skip-minimum-package-age' || '' }}
      - run: pnpm run build
      # npm auth is trusted publishing (OIDC via id-token: write), not a token.
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
